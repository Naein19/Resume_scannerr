      Engineer Intern, Beta Inc \u2014 Jun 2020 to Aug 2020\nWrote unit tests and
      fixed bugs in a Django codebase.\n\nEDUCATION\nB.S. Computer Science, State
      University, 2020\n\nSKILLS\nPython, FastAPI, Django, PostgreSQL, Docker, AWS\n\nCERTIFICATIONS\nAWS
      Certified Developer \u2013 Associate\n</resume_text>\n\nThe correct JSON output
      is:\n{\n  \"name\": \"Jane Doe\",\n  \"email\": \"jane.doe@example.com\",\n  \"phone\":
