      about it, output null (or an empty list for list fields). Never guess, infer,
      or fabricate a value to fill a field.\n3. Copy dates, degree names, and company
      names as written on the resume \u2014 do not normalize or reformat them.\n4.
      `total_experience_years` is the one field you should compute rather than copy
      verbatim: estimate it from the work history date ranges. If work history is
      empty or dates are unparseable, output null.\n5. Deduplicate skills (case-insensitive)
      but preserve the applicant''s own capitalization/phrasing for the first occurrence.\n\n\nEXAMPLE\nGiven
